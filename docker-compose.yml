version: "3.8"
services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/password.txt:/mosquitto/config/password.txt
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
